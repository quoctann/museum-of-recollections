# Isolated test-only database: no .env, no development volumes, random host port.
services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: museum_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Generated by api_tools.py}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museum_test -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
