name: museum-of-recollections

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run make setup first}
      POSTGRES_DB: ${POSTGRES_DB:?Run make setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  minio:
    build: ./deploy/local/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run make setup first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run make setup first}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    profiles: ["application"]
    build: ./apps/api
    environment: &api-environment
      API_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL_CONTAINER:?Set the container database URL in .env}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run make setup first}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Run make setup first}
      S3_BUCKET: ${S3_BUCKET:-recollections}
      S3_USE_SSL: "false"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  storage-init:
    profiles: ["application"]
    build: ./apps/api
    environment: *api-environment
    entrypoint: ["/usr/local/bin/storage-init"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  web:
    profiles: ["application"]
    build: ./apps/web
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
